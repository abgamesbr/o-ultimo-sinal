
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB GAMES - O Último Sinal</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

.fundo {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at center, #303030 0%, #111 48%, #030303 100%);
}

.nevoa {
  position: absolute;
  width: 150%;
  height: 100%;
  left: -25%;
  bottom: -20%;
  background: radial-gradient(ellipse, rgba(110,110,110,.16), transparent 65%);
  filter: blur(35px);
  animation: nevoa 9s ease-in-out infinite alternate;
}

@keyframes nevoa {
  from { transform: translateX(-5%); }
  to { transform: translateX(5%); }
}

.conteudo {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 35px 20px;
  text-align: center;
}

.logo {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 7px;
  color: #aaa;
}

.logo span {
  color: #b90000;
}

.titulo {
  margin-top: auto;
  margin-bottom: auto;
}

.titulo h1 {
  font-size: clamp(38px, 8vw, 76px);
  letter-spacing: 5px;
  color: #e5e5e5;
  text-shadow: 0 0 18px rgba(180,0,0,.55);
}

.titulo p {
  margin-top: 18px;
  font-size: 13px;
  letter-spacing: 3px;
  color: #999;
}

.menu, #painelOpcoes {
  width: min(300px, 90vw);
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

button {
  width: 100%;
  background: rgba(20,20,20,.85);
  color: white;
  border: 1px solid #555;
  padding: 15px;
  font-size: 15px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  background: #790000;
  border-color: #d00000;
  transform: scale(1.04);
}

.jogar {
  border-color: #a00000;
  background: rgba(100,0,0,.35);
}

#painelOpcoes {
  display: none;
  background: rgba(10,10,10,.88);
  border: 1px solid #5c0000;
  padding: 22px;
}

#painelOpcoes h2 {
  margin-bottom: 22px;
  letter-spacing: 5px;
  color: #d5d5d5;
}

.configuracao {
  margin: 18px 0;
  text-align: left;
  color: #bbb;
  font-size: 13px;
  letter-spacing: 2px;
}

input[type="range"], select {
  width: 100%;
  margin-top: 12px;
  accent-color: #a00000;
}

select {
  padding: 10px;
  color: white;
  background: #191919;
  border: 1px solid #555;
}

#mensagem {
  color: #c9c9c9;
  font-size: 12px;
  min-height: 16px;
  margin-top: 8px;
}

.rodape {
  color: #555;
  font-size: 10px;
  letter-spacing: 3px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="fundo">
  <div class="nevoa"></div>
</div>

<main class="conteudo">

  <div class="logo">
    AB <span>GAMES</span>
  </div>

  <section class="titulo">
    <h1>O ÚLTIMO<br>SINAL</h1>
    <p>NEM TODO SINAL DEVE SER SEGUIDO...</p>
  </section>

  <section class="menu" id="menuPrincipal">
    <button class="jogar" onclick="jogar()">JOGAR</button>
    <button onclick="opcoes()">OPÇÕES</button>
    <button onclick="creditos()">CRÉDITOS</button>
    <div id="mensagem"></div>
  </section>

  <section id="painelOpcoes">
    <h2>OPÇÕES</h2>

    <div class="configuracao">
      VOLUME
      <input id="volume" type="range" min="0" max="100" value="50">
    </div>

    <div class="configuracao">
      SENSIBILIDADE
      <input id="sensibilidade" type="range" min="1" max="100" value="50">
    </div>

    <div class="configuracao">
      QUALIDADE GRÁFICA
      <select id="qualidade">
        <option value="baixa">BAIXA</option>
        <option value="media" selected>MÉDIA</option>
        <option value="alta">ALTA</option>
      </select>
    </div>

    <button onclick="voltarMenu()">VOLTAR</button>
  </section>

  <div class="rodape">
    AB GAMES © 2026
  </div>

</main>

<script>
function jogar() {
  document.getElementById("mensagem").textContent =
    "A SUA HISTÓRIA COMEÇA EM BREVE...";
}

function opcoes() {
  document.getElementById("menuPrincipal").style.display = "none";
  document.getElementById("painelOpcoes").style.display = "block";
  document.getElementById("mensagem").textContent = "";
}

function voltarMenu() {
  document.getElementById("painelOpcoes").style.display = "none";
  document.getElementById("menuPrincipal").style.display = "flex";
}

function creditos() {
  document.getElementById("mensagem").textContent =
    "DESENVOLVIDO POR AB GAMES";
}
</script>

</body>
</html>
