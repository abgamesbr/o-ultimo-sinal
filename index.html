
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB GAMES - O Último Sinal</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

.fundo {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to bottom, rgba(0,0,0,.45), #050505),
    radial-gradient(ellipse at center, #333 0%, #111 45%, #030303 100%);
  overflow: hidden;
}

.nevoa {
  position: absolute;
  width: 150%;
  height: 100%;
  left: -25%;
  bottom: -20%;
  background: radial-gradient(ellipse, rgba(110,110,110,.16), transparent 65%);
  filter: blur(35px);
  animation: nevoa 9s ease-in-out infinite alternate;
}

@keyframes nevoa {
  from { transform: translateX(-5%); }
  to { transform: translateX(5%); }
}

.conteudo {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 35px 20px 35px;
  text-align: center;
}

.logo {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 7px;
  color: #aaa;
}

.logo span {
  color: #b90000;
}

.titulo {
  margin-top: auto;
  margin-bottom: auto;
}

.titulo h1 {
  font-size: clamp(38px, 8vw, 76px);
  letter-spacing: 5px;
  color: #e5e5e5;
  text-shadow: 0 0 18px rgba(180,0,0,.55);
}

.titulo p {
  margin-top: 18px;
  font-size: 13px;
  letter-spacing: 4px;
  color: #999;
}

.menu {
  width: 230px;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

button {
  background: rgba(20,20,20,.85);
  color: white;
  border: 1px solid #555;
  padding: 15px;
  font-size: 15px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  background: #790000;
  border-color: #d00000;
  transform: scale(1.05);
}

.jogar {
  border-color: #a00000;
  background: rgba(100,0,0,.35);
}

.rodape {
  color: #555;
  font-size: 10px;
  letter-spacing: 3px;
  margin-top: 20px;
}

#mensagem {
  color: #c9c9c9;
  font-size: 12px;
  min-height: 16px;
}
</style>
</head>

<body>

<div class="fundo">
  <div class="nevoa"></div>
</div>

<main class="conteudo">

  <div class="logo">
    AB <span>GAMES</span>
  </div>

  <section class="titulo">
    <h1>O ÚLTIMO<br>SINAL</h1>
    <p>NEM TODO SINAL DEVE SER SEGUIDO...</p>
  </section>

  <section class="menu">
    <button class="jogar" onclick="jogar()">JOGAR</button>
    <button onclick="opcoes()">OPÇÕES</button>
    <button onclick="creditos()">CRÉDITOS</button>
    <div id="mensagem"></div>
  </section>

  <div class="rodape">
    AB GAMES © 2026
  </div>

</main>

<script>
function jogar() {
  document.getElementById("mensagem").textContent =
    "A SUA HISTÓRIA COMEÇA EM BREVE...";
}

function opcoes() {
  document.getElementById("mensagem").textContent =
    "OPÇÕES EM DESENVOLVIMENTO";
}

function creditos() {
  document.getElementById("mensagem").textContent =
    "DESENVOLVIDO POR AB GAMES";
}
</script>

</body>
</html>
